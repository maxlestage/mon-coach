name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  moteur-swift:
    name: Moteur Swift
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Tests de MonCoachKit
        run: swift test --package-path ios/MonCoachKit

  site-web:
    name: Site web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Installation
        run: bun install --frozen-lockfile
      - name: Vérification des types
        run: bun run typecheck
      - name: Tests
        run: bun test
      - name: Construction
        run: bun run build

  coherence:
    name: Cohérence app / site
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Régénération des valeurs de référence
        run: swift run --package-path tools/FixtureGenerator > /tmp/engine-reference.json
      - name: Comparaison avec le fichier versionné
        run: |
          if ! diff -u web/src/coach/__fixtures__/engine-reference.json /tmp/engine-reference.json; then
            echo "::error::Le moteur Swift a changé sans que les valeurs de référence du site soient régénérées."
            echo "Lance : swift run --package-path tools/FixtureGenerator > web/src/coach/__fixtures__/engine-reference.json"
            exit 1
          fi
