name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  moteur-swift:
    name: Moteur Swift
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Tests de MonCoachKit
        run: swift test --package-path ios/MonCoachKit
      - name: Attributs de la Live Activity identiques entre app et extension
        run: |
          # ActivityKit exige que l'application et l'extension compilent le
          # même type d'attributs ; le fichier existe donc en deux exemplaires
          # qui doivent rester identiques à l'octet près.
          diff ios/MonCoach/MonCoach/Session/WorkoutAttributes.swift \
               ios/MonCoach/MonCoachWidgets/WorkoutAttributes.swift
          diff ios/MonCoach/MonCoach/Session/RunAttributes.swift \
               ios/MonCoach/MonCoachWidgets/RunAttributes.swift

  site-web:
    name: Site web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Installation
        run: bun install --frozen-lockfile
      - name: Vérification des types
        run: bun run typecheck
      - name: Tests
        run: bun test
      - name: Construction
        run: bun run build

  carte:
    name: Carte dans un navigateur
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Installation
        run: bun install --frozen-lockfile
      - name: Construction
        run: bun run build
      - name: Installation de Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: La carte se charge, dessine le tracé, et sait réessayer
        # Le serveur de tuiles est simulé : ce travail vérifie notre code —
        # cycle de vie, worker, rendu de la couche, repli, réessai — pas la
        # disponibilité d'OpenStreetMap. Le chemin succès y est exercé pour
        # de vrai : c'est celui qu'aucun test ne couvrait quand la carte
        # détruisait sa propre instance à l'instant où elle réussissait.
        run: node verify-map.mjs

  image-de-deploiement:
    name: Image de déploiement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t mon-coach-web:ci ./web
      - name: Vérifier que le conteneur sert bien le site
        run: |
          # Le Dockerfile part en production : il est testé comme le reste,
          # pas seulement relu.
          docker run -d --name mon-coach-web -e PORT=8080 -p 8080:8080 mon-coach-web:ci
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ -o /tmp/page.html && break
            sleep 1
          done
          # Le site doit répondre dans les trois langues : une page dont le
          # paquet JavaScript ne contient plus une des traductions est un
          # site qui ne parle plus qu'une langue sans que rien ne le dise.
          for lang in fr en es; do
            curl -sf "http://127.0.0.1:8080/?lang=$lang" -o /dev/null \
              || { echo "la page ne répond pas en $lang"; exit 1; }
          done
          grep -q "Mon Coach" /tmp/page.html
          asset=$(grep -oE '/assets/[a-zA-Z0-9._-]+\.js' /tmp/page.html | head -1)
          test -n "$asset"
          curl -sfI "http://127.0.0.1:8080$asset" | grep -qi "max-age=31536000"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/route-inconnue)" = "404"
          # Comportements de production : redirection vers HTTPS quand le
          # routeur de l'hébergeur dit que le visiteur était en clair, et
          # robots.txt présent.
          curl -sI -H "x-forwarded-proto: http" http://127.0.0.1:8080/ | grep -qi "^location: https://"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/robots.txt)" = "200"
          # La PWA et les pages légales font partie du contrat de production.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/mentions-legales)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/confidentialite)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/conditions)" = "200"
          curl -sI http://127.0.0.1:8080/manifest.webmanifest | grep -qi "application/manifest+json"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/sw.js)" = "200"
          curl -s http://127.0.0.1:8080/sw.js | grep -q "PRECACHE"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/icons/icon-512.png)" = "200"
          docker rm -f mon-coach-web
          echo "L'image sert le site, redirige vers HTTPS derrière un routeur, expose robots.txt, met en cache les assets versionnés et renvoie 404 sur les routes inconnues."

  demarrage-heroku:
    name: Démarrage Heroku
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Démarrer comme le fait Heroku, depuis un dépôt fraîchement cloné
        run: |
          # `bun start` à la racine est la commande que lance le buildpack Bun.
          # Elle part ici d'un dépôt sans dist/, donc du cas le plus défavorable :
          # installation, construction et service dans le même souffle.
          PORT=8090 bun start > /tmp/start.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://127.0.0.1:8090/ -o /tmp/page.html && break
            sleep 1
          done
          cat /tmp/start.log
          grep -q "Mon Coach" /tmp/page.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/route-inconnue)" = "404"
          echo "Le démarrage à froid sert bien le site."

  coherence:
    name: Cohérence app / site
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Régénération des valeurs de référence
        run: swift run --package-path tools/FixtureGenerator FixtureGenerator moteur > /tmp/engine-reference.json
      - name: Comparaison avec le fichier versionné
        run: |
          if ! diff -u web/src/coach/__fixtures__/engine-reference.json /tmp/engine-reference.json; then
            echo "::error::Le moteur Swift a changé sans que les valeurs de référence du site soient régénérées."
            echo "Lance : swift run --package-path tools/FixtureGenerator FixtureGenerator moteur > web/src/coach/__fixtures__/engine-reference.json"
            exit 1
          fi
      - name: Régénération des exemples affichés par le site
        run: swift run --package-path tools/FixtureGenerator FixtureGenerator exemples > /tmp/examples.json
      - name: Le site montre bien ce que l'application produit
        run: |
          # La journée de repas, la fiche technique et le remplacement
          # d'exercice affichés sur le site sortent du moteur. Sans cette
          # comparaison, la page continuerait d'annoncer un plan que
          # l'application ne produit plus.
          if ! diff -u web/src/data/examples.json /tmp/examples.json; then
            echo "::error::Le moteur a changé sans que les exemples du site soient régénérés."
            echo "Lance : swift run --package-path tools/FixtureGenerator FixtureGenerator exemples > web/src/data/examples.json"
            exit 1
          fi

  marque:
    name: Marque
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installation de Pillow
        # Pas de version épinglée : seules les sorties textuelles sont
        # comparées, et elles ne dépendent pas du rasteriseur.
        run: pip install pillow
      - name: Régénération de la marque
        run: python3 tools/brand/generate.py
      - name: Le dessin du site est bien celui du générateur
        run: |
          # Seules les sorties textuelles sont comparées. Le rendu des PNG
          # dépend de l'anticrénelage de Pillow, qui peut changer d'une
          # version à l'autre sans que le dessin change : le comparer
          # octet à octet ferait échouer la CI pour rien. Le composant React,
          # le SVG et les favicons, eux, sont déterministes — et ce sont eux
          # qu'une retouche à la main ferait diverger des icônes.
          if ! git diff --exit-code -- \
            web/src/components/BrandMark.tsx \
            web/src/icons/mark.svg \
            web/src/index.html \
            web/src/mentions-legales.html \
            web/src/confidentialite.html \
            web/src/conditions.html; then
            echo "::error::La marque a été retouchée à la main au lieu d'être régénérée."
            echo "Modifie la géométrie dans tools/brand/generate.py puis lance : python3 tools/brand/generate.py"
            exit 1
          fi
