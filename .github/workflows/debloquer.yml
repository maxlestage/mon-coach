name: Débloquer la mise en vente

# Fait chez Apple ce qui restait « à faire à la main », et qui donc ne se
# faisait pas.
#
# Trois gestes, tous idempotents — relancer ne crée rien deux fois :
#
#   1. Les deux abonnements Stride+ : le groupe, les offres, leurs textes
#      dans les trois langues, et leurs prix. C'est le blocage numéro un de
#      la mise en vente, et il tient dans un écran d'App Store Connect qui
#      n'est pas praticable depuis un téléphone.
#   2. Le groupe d'applications, sans lequel les widgets ne voient rien de ce
#      que l'application écrit. Si l'API ne sait pas le créer, le journal le
#      dit clairement plutôt que d'échouer en silence.
#   3. L'anglais et l'espagnol sur la fiche. L'application est traduite en
#      trois langues, sa fiche n'existait qu'en français.
#
# Contrairement aux autres workflows du dossier, celui-ci ÉCRIT chez Apple.
# D'où le déclenchement à la main, et lui seul : rien ici ne doit partir sur
# une simple poussée.

on:
  workflow_dispatch:
    inputs:
      abonnements:
        description: "Créer les deux abonnements Stride+"
        type: boolean
        default: true
      groupe:
        description: "Créer le groupe d'applications (widgets)"
        type: boolean
        default: true
      langues:
        description: "Ajouter l'anglais et l'espagnol à la fiche"
        type: boolean
        default: true

jobs:
  debloquer:
    name: Ce qui restait à faire chez Apple
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Poser la clé d'API
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 || secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          # Hors du dépôt, dans un dossier qui meurt avec la machine. Acceptée
          # en clair comme en base64 : le workflow s'adapte au secret posé.
          if [ -z "$ASC_KEY_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::Les secrets App Store Connect manquent."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          case "$PRIVATE_KEY" in
            *"BEGIN PRIVATE KEY"*) printf '%s\n' "$PRIVATE_KEY" > "$KEY" ;;
            *) printf '%s' "$PRIVATE_KEY" | base64 --decode > "$KEY" ;;
          esac
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Les deux abonnements
        if: inputs.abonnements
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
        run: |
          echo "::group::Abonnements"
          python3 tools/appstore/creer_les_abonnements.py | tee "$RUNNER_TEMP/abonnements.txt"
          echo "::endgroup::"

      - name: Le groupe d'applications
        if: inputs.groupe
        # Le seul pas dont on ignore l'issue : l'API expose peut-être les
        # groupes, peut-être pas. Un échec ici ne doit pas emporter les deux
        # autres gestes, qui n'ont rien à voir — d'où continue-on-error, et
        # le code de sortie 2 traduit en avertissement lisible.
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
        run: |
          echo "::group::Groupe d'applications"
          set +e
          python3 tools/appstore/creer_le_groupe.py 2>&1 | tee "$RUNNER_TEMP/groupe.txt"
          code=${PIPESTATUS[0]}
          set -e
          echo "::endgroup::"
          if [ "$code" = "2" ]; then
            echo "::warning::L'API ne sait pas créer les groupes — à faire sur le portail."
          fi
          exit "$code"

      - name: L'anglais et l'espagnol
        if: inputs.langues
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
        run: |
          echo "::group::Langues de la fiche"
          python3 tools/appstore/ajouter_les_langues.py | tee "$RUNNER_TEMP/langues.txt"
          echo "::endgroup::"

      - name: Ce qui manque encore
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
        run: |
          # L'état des lieux après coup, et non avant : c'est lui qui dit si
          # les gestes ont porté, et il le demande à Apple plutôt qu'à nous.
          echo "::group::Prêt pour la vente"
          python3 tools/appstore/pret_pour_la_vente.py | tee "$RUNNER_TEMP/etat.txt" || true
          echo "::endgroup::"

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "## Ce qui a été fait chez Apple"
            echo
            for f in abonnements groupe langues etat; do
              if [ -f "$RUNNER_TEMP/$f.txt" ]; then
                echo "### $f"
                echo '```'
                cat "$RUNNER_TEMP/$f.txt"
                echo '```'
                echo
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
