name: TestFlight

# Déclenché à la main, jamais automatiquement.
#
# Un exécuteur macOS coûte dix fois les minutes d'un Linux : le lancer à
# chaque poussée brûlerait le quota sans rien apporter, puisqu'un build
# TestFlight ne sert que quand on veut distribuer. Le numéro de version se
# saisit au lancement ; le numéro de build vient du compteur d'exécutions,
# qui ne recule jamais — App Store Connect refuse un build déjà vu.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version affichée (ex. 1.0.1). Vide = celle du projet."
        required: false
        type: string
      notes:
        description: "Nouveautés pour les testeurs"
        required: false
        default: "Build interne."
        type: string

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    name: Archive et envoi à TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SCHEME: MonCoach
      PROJECT: ios/MonCoach/MonCoach.xcodeproj
      ARCHIVE: ${{ github.workspace }}/build/MonCoach.xcarchive
      EXPORT_DIR: ${{ github.workspace }}/build/export
      # Le numéro de build : monotone par construction, jamais réutilisé.
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que tout est configuré
        # Un échec franc et nommé, jamais un vert de bonne conscience : un
        # travail qui « réussit » sans rien livrer a déjà coûté cher à ce
        # dépôt côté déploiement web. Chaque secret manquant est dit.
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          missing=""
          [ -z "$TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing APPSTORE_KEY_ID"
          [ -z "$ISSUER_ID" ] && missing="$missing APPSTORE_ISSUER_ID"
          [ -z "$PRIVATE_KEY" ] && missing="$missing APPSTORE_PRIVATE_KEY"
          [ -z "$CERTIFICATE" ] && missing="$missing APPLE_DISTRIBUTION_CERT_P12"
          [ -z "$CERTIFICATE_PASSWORD" ] && missing="$missing APPLE_DISTRIBUTION_CERT_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants :$missing — voir docs/TESTFLIGHT.md"
            exit 1
          fi
          echo "Configuration complète."

      - name: Choisir Xcode et l'outillage
        env:
          # Épingler une version se fait par une variable de dépôt, pas dans
          # ce fichier : coder « Xcode_26.app » en dur ferait échouer le
          # build le jour où l'image des exécuteurs change, sur une erreur
          # qui ne dit pas ce qui s'est passé. Vide = la plus récente
          # installée, et le journal dit toujours laquelle.
          PINNED: ${{ vars.XCODE_VERSION }}
        run: |
          if [ -n "$PINNED" ]; then
            APP="/Applications/Xcode_${PINNED}.app"
            if [ ! -d "$APP" ]; then
              echo "::error::Xcode $PINNED absent de l'exécuteur. Disponibles :"
              ls -d /Applications/Xcode*.app
              exit 1
            fi
          else
            APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          sudo xcode-select -switch "$APP"
          echo "Xcode : $(xcodebuild -version | head -1) ($APP)"
          echo "Swift : $(swift --version 2>&1 | head -1)"

          # xcbeautify rend les journaux lisibles dans l'interface. Il est
          # présent sur les images actuelles ; on ne le suppose pas pour
          # autant, et son absence ne doit pas arrêter un build.
          command -v xcbeautify > /dev/null || brew install xcbeautify || true
          command -v xcbeautify > /dev/null && echo "FORMATTER=xcbeautify --renderer github-actions" >> "$GITHUB_ENV" \
            || echo "FORMATTER=cat" >> "$GITHUB_ENV"

      - name: Installer le certificat de distribution
        env:
          CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          # Un trousseau temporaire, propre à cette exécution : l'exécuteur
          # est détruit après, mais un trousseau dédié évite de dépendre de
          # l'état du trousseau par défaut de l'image.
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Sans cette ligne, codesign ouvre une boîte de dialogue que
          # personne ne verra jamais et le build reste bloqué jusqu'au
          # délai d'attente.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Poser la clé d'API App Store Connect
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$PRIVATE_KEY" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Archiver
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          # La version n'est écrasée que si elle est fournie : sinon celle du
          # projet fait foi, et le dépôt reste la source de vérité.
          VERSION_ARGS=""
          if [ -n "$VERSION" ]; then
            VERSION_ARGS="MARKETING_VERSION=$VERSION"
          fi

          # `-allowProvisioningUpdates` avec la clé d'API laisse Xcode créer
          # et télécharger les profils des trois cibles — application, montre
          # et widget — sans qu'aucun profil n'ait à être versionné ici.
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            $VERSION_ARGS \
            | $FORMATTER

      - name: Exporter et envoyer à TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          # `destination: upload` fait l'envoi dans la foulée de l'export,
          # sans passer par altool, que Apple a déprécié.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$EXPORT_DIR" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | $FORMATTER

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "### TestFlight"
            echo ""
            echo "- Build : \`$BUILD_NUMBER\`"
            echo "- Version : \`${{ inputs.version || 'celle du projet' }}\`"
            echo "- Nouveautés : ${{ inputs.notes }}"
            echo ""
            echo "Le traitement par Apple prend cinq à quinze minutes après l'envoi."
            echo "Le build apparaît ensuite dans App Store Connect → TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Garder les journaux en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-xcodebuild
          path: |
            ${{ github.workspace }}/build/**/*.log
            ~/Library/Logs/gym
          if-no-files-found: ignore
          retention-days: 7
