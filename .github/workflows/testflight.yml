name: TestFlight

# Déclenché à la main, jamais automatiquement.
#
# Un exécuteur macOS coûte dix fois les minutes d'un Linux : le lancer à
# chaque poussée brûlerait le quota sans rien apporter, puisqu'un build
# TestFlight ne sert que quand on veut distribuer. Le numéro de version se
# saisit au lancement ; le numéro de build vient du compteur d'exécutions,
# qui ne recule jamais — App Store Connect refuse un build déjà vu.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version affichée (ex. 1.0.1). Vide = celle du projet."
        required: false
        type: string
      notes:
        description: "Nouveautés pour les testeurs"
        required: false
        default: "Build interne."
        type: string

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    name: Archive et envoi à TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SCHEME: MonCoach
      PROJECT: ios/MonCoach/MonCoach.xcodeproj
      ARCHIVE: ${{ github.workspace }}/build/MonCoach.xcarchive
      EXPORT_DIR: ${{ github.workspace }}/build/export
      # Le numéro de build : monotone par construction, jamais réutilisé.
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que tout est configuré
        id: config
        # Un échec franc et nommé, jamais un vert de bonne conscience : un
        # travail qui « réussit » sans rien livrer a déjà coûté cher à ce
        # dépôt côté déploiement web. Chaque secret manquant est dit.
        #
        # Le certificat de distribution est facultatif, et c'est délibéré :
        # sa clé privée se génère sur une machine, ce qui impose un Mac pour
        # l'exporter. Sans lui, le workflow en fabrique un sur l'exécuteur via
        # la clé d'API — voir l'étape qui le pose pour ce que ça coûte.
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Deux jeux de noms sont acceptés pour la clé d'API : ASC_* d'abord,
          # APPSTORE_* ensuite. Un nom de secret ne se renomme pas — il se
          # supprime et se repose, valeur comprise — et forcer ce geste pour
          # une question d'étiquette ferait perdre la clé à qui ne l'a plus
          # sous la main. Le workflow s'adapte, pas la personne.
          KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 || secrets.APPSTORE_PRIVATE_KEY }}
          CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          missing=""
          [ -z "$TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$PRIVATE_KEY" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Secrets obligatoires manquants :$missing — voir docs/TESTFLIGHT.md"
            echo ""
            echo "Un secret vu ici comme manquant peut être posé au mauvais"
            echo "endroit : seuls comptent Settings → Secrets and variables →"
            echo "Actions → onglet Secrets → Repository secrets. Les onglets"
            echo "Codespaces et Dependabot, les secrets d'environnement et les"
            echo "« Variables » ne sont pas lus ici. Les noms sont sensibles à"
            echo "la casse, et ASC_KEY_ID / APPSTORE_KEY_ID sont acceptés."
            exit 1
          fi

          # Le couple certificat / mot de passe se pose ensemble ou pas du
          # tout : n'en avoir qu'un est une configuration à moitié faite, et
          # l'échec arriverait bien plus tard, à la signature.
          if [ -n "$CERTIFICATE" ] && [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "::error::APPLE_DISTRIBUTION_CERT_P12 est posé mais APPLE_DISTRIBUTION_CERT_PASSWORD manque."
            exit 1
          fi
          if [ -z "$CERTIFICATE" ] && [ -n "$CERTIFICATE_PASSWORD" ]; then
            echo "::error::APPLE_DISTRIBUTION_CERT_PASSWORD est posé mais APPLE_DISTRIBUTION_CERT_P12 manque."
            exit 1
          fi

          if [ -n "$CERTIFICATE" ]; then
            echo "has_cert=true" >> "$GITHUB_OUTPUT"
            echo "Certificat fourni : il sera importé dans un trousseau dédié."
          else
            echo "has_cert=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aucun certificat fourni : il sera créé via la clé d'API."
            echo "La clé doit alors avoir le rôle Admin, et chaque exécution consomme un"
            echo "emplacement de certificat de distribution — il y en a deux par compte."
          fi
          echo "Configuration complète."

      - name: Choisir Xcode et l'outillage
        env:
          # Épingler une version se fait par une variable de dépôt, pas dans
          # ce fichier : coder « Xcode_26.app » en dur ferait échouer le
          # build le jour où l'image des exécuteurs change, sur une erreur
          # qui ne dit pas ce qui s'est passé. Vide = la plus récente
          # installée, et le journal dit toujours laquelle.
          PINNED: ${{ vars.XCODE_VERSION }}
        run: |
          if [ -n "$PINNED" ]; then
            APP="/Applications/Xcode_${PINNED}.app"
            if [ ! -d "$APP" ]; then
              echo "::error::Xcode $PINNED absent de l'exécuteur. Disponibles :"
              ls -d /Applications/Xcode*.app
              exit 1
            fi
          else
            APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          sudo xcode-select -switch "$APP"
          echo "Xcode : $(xcodebuild -version | head -1) ($APP)"
          echo "Swift : $(swift --version 2>&1 | head -1)"

          # xcbeautify rend les journaux lisibles dans l'interface. Il est
          # présent sur les images actuelles ; on ne le suppose pas pour
          # autant, et son absence ne doit pas arrêter un build.
          command -v xcbeautify > /dev/null || brew install xcbeautify || true
          command -v xcbeautify > /dev/null && echo "FORMATTER=xcbeautify --renderer github-actions" >> "$GITHUB_ENV" \
            || echo "FORMATTER=cat" >> "$GITHUB_ENV"


      - name: Poser la clé d'API App Store Connect
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 || secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          DEST="$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"

          # Le contenu du .p8 se pose de deux façons également naturelles :
          # collé tel quel depuis le fichier, ou encodé en base64. Les deux
          # sont acceptés. Décoder à l'aveugle un PEM déjà en clair produit
          # un fichier vide ou du bruit, et l'erreur ne tomberait qu'à
          # l'archivage, sous la forme d'un « invalid authentication » qui
          # ne dit rien de la cause.
          case "$PRIVATE_KEY" in
            *"BEGIN PRIVATE KEY"*) printf '%s\n' "$PRIVATE_KEY" > "$DEST" ;;
            *) printf '%s' "$PRIVATE_KEY" | base64 --decode > "$DEST" ;;
          esac

          # Une vérification franche ici vaut vingt minutes de build perdues.
          if ! grep -q "BEGIN PRIVATE KEY" "$DEST"; then
            echo "::error::La clé privée n'est pas exploitable : ni PEM en clair, ni base64 d'un PEM."
            echo "Repose le secret avec le contenu exact du fichier .p8 téléchargé"
            echo "chez Apple, lignes -----BEGIN----- et -----END----- comprises."
            exit 1
          fi
          chmod 600 "$DEST"
          echo "Clé d'API en place pour le Key ID fourni."

      - name: Préparer les identifiants et la fiche chez Apple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
          # Vide par défaut : c'est le script qui porte la liste des noms à
          # tenter, replis compris. Une valeur ici passe devant sans supprimer
          # les replis — mieux vaut une fiche nommée autrement que pas nommée.
          APP_NAME: ${{ vars.APP_STORE_NAME }}
        run: |
          # Trois choses doivent exister chez Apple avant qu'un build parte,
          # et aucune ne se crée pendant la compilation : les identifiants des
          # trois cibles, la capacité HealthKit de la montre, et la fiche de
          # l'application. Tout est créé ici, à l'identique si c'est déjà là.
          #
          # Cette étape tombe avant l'archivage, qui dure un quart d'heure.
          # Sans elle, l'absence de fiche ne se voyait qu'à l'envoi, sur un
          # « Error Downloading App Information » qui ne nomme rien.
          export ASC_KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          python3 tools/appstore/provision.py

      - name: Poser un certificat de distribution
        # L'étape décisive, et celle qui a coûté le plus cher à comprendre.
        #
        # Une archive destinée à TestFlight doit être signée par un certificat
        # *Apple Distribution*. Laissé seul avec `-allowProvisioningUpdates`,
        # Xcode en demande un à Apple — et quand Apple refuse, il retombe sans
        # un mot sur un certificat de *développement*. L'archive part alors
        # signée pour le débogage, et le build meurt bien plus loin sur un
        # profil introuvable, sans qu'une seule ligne parle de certificat.
        #
        # Cette décision silencieuse est donc retirée à Xcode : le certificat
        # est ici, avant l'archivage, ou le build s'arrête en le disant.
        env:
          CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
          HAS_CERT: ${{ steps.config.outputs.has_cert }}
        run: |
          set -o pipefail
          WORK="$RUNNER_TEMP/signing"
          mkdir -p "$WORK"
          P12="$WORK/distribution.p12"

          if [ "$HAS_CERT" = "true" ]; then
            echo "$CERTIFICATE" | base64 --decode > "$P12"
            P12_PASSWORD="$CERTIFICATE_PASSWORD"
          else
            # Le certificat naît ici : sa clé privée est générée sur cet
            # exécuteur, et Apple ne signe que ça. C'est ce qui impose
            # habituellement un Mac, et c'est ce qu'on remplace.
            export ASC_KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
            export OUT_DIR="$WORK"

            set +e
            python3 tools/appstore/distribution_certificate.py
            created=$?
            set -e

            # Le code 9 veut dire « plus de place » : le compte a ses deux
            # certificats de distribution, et ce sont les nôtres — la clé
            # privée de chacun est morte avec l'exécuteur qui l'a créée.
            # Personne ne peut plus s'en servir, pas même nous. On libère,
            # puis on redemande une fois.
            if [ "$created" -eq 9 ]; then
              echo "::notice::Plus de place : libération des certificats laissés par cette automatisation."
              python3 tools/appstore/distribution_certificate.py --revoke-stale
              python3 tools/appstore/distribution_certificate.py
            elif [ "$created" -ne 0 ]; then
              exit "$created"
            fi

            # De quoi rendre la place en fin d'exécution, quoi qu'il arrive
            # ensuite.
            cp "$WORK/certificate-id.txt" "$RUNNER_TEMP/certificate-id.txt"

            P12_PASSWORD="$(uuidgen)"
            openssl pkcs12 -export \
              -inkey "$WORK/distribution.key" \
              -in "$WORK/distribution.pem" \
              -out "$P12" \
              -passout "pass:$P12_PASSWORD"
          fi
          # Le mot de passe est aléatoire dans un cas, secret dans l'autre :
          # masqué dans les deux, pour qu'aucune trace n'en subsiste si une
          # commande venait à l'écho.
          echo "::add-mask::$P12_PASSWORD"

          # Un trousseau temporaire, propre à cette exécution : l'exécuteur
          # est détruit après, mais un trousseau dédié évite de dépendre de
          # l'état du trousseau par défaut de l'image.
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$P12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$P12" "$WORK/distribution.key"

          # Sans cette ligne, codesign ouvre une boîte de dialogue que
          # personne ne verra jamais et le build reste bloqué jusqu'au
          # délai d'attente.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # La vérification qui manquait. Sans elle, l'absence d'identité de
          # distribution ne se voyait qu'à l'échec de l'archivage, sous une
          # forme qui n'en parlait pas.
          echo "Identités de signature disponibles :"
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" \
              | grep -q "Apple Distribution"; then
            echo "::error::Aucune identité « Apple Distribution » dans le trousseau."
            echo "Une archive signée en développement est refusée par TestFlight."
            exit 1
          fi

      - name: Archiver
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail

          # Xcode télécharge les profils qu'il vient de créer dans ces deux
          # dossiers, sans jamais les créer lui-même. Sur un exécuteur neuf,
          # aucun des deux n'existe : le profil est bien créé chez Apple, son
          # identifiant apparaît dans le graphe de construction, et l'écriture
          # échoue en silence. Le build meurt alors sur un « fichier d'entrée
          # introuvable » qui désigne un profil dont personne n'a demandé
          # l'emplacement.
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          # xcbeautify rend le journal lisible, mais il jette précisément ce
          # qu'on veut quand la signature échoue. Le brut part dans un fichier,
          # gardé en pièce jointe et résumé plus bas en cas d'échec.
          mkdir -p "$GITHUB_WORKSPACE/build"
          RAW="$GITHUB_WORKSPACE/build/xcodebuild-archive.log"

          # La version n'est écrasée que si elle est fournie : sinon celle du
          # projet fait foi, et le dépôt reste la source de vérité.
          VERSION_ARGS=""
          if [ -n "$VERSION" ]; then
            VERSION_ARGS="MARKETING_VERSION=$VERSION"
          fi

          # `-allowProvisioningUpdates` avec la clé d'API laisse Xcode créer
          # et télécharger les profils des trois cibles — application, montre
          # et widget — sans qu'aucun profil n'ait à être versionné ici.
          #
          # Quand aucun certificat n'a été fourni, c'est aussi ce drapeau qui
          # en fait créer un : Xcode génère la clé privée sur l'exécuteur et
          # demande le certificat à Apple. Ça marche, avec deux réserves à
          # connaître — la clé d'API doit avoir le rôle Admin, et un compte
          # n'a droit qu'à deux certificats de distribution, or l'exécuteur
          # est détruit après chaque build, donc chaque exécution en consomme
          # un. Au troisième build, il faudra révoquer les précédents dans
          # developer.apple.com. C'est un dépannage pour partir sans Mac, pas
          # un régime de croisière.
          # Xcode ne télécharge qu'un profil par invocation.
          #
          # Ce projet en demande trois — application, widget, montre — et
          # chaque exécution en crée un chez Apple, l'écrit sur le disque,
          # puis meurt sur le suivant, qu'elle vient pourtant de réclamer.
          # Deux exécutions l'ont montré : la première est morte sur le profil
          # de l'application, la seconde sur celui de la montre, après avoir
          # posé celui du widget.
          #
          # Les profils déjà posés survivent d'une tentative à l'autre, et
          # Apple réutilise ceux qui existent au lieu d'en créer d'autres.
          # Relancer converge donc, en autant de tentatives qu'il reste de
          # profils manquants. Quatre laissent une tentative de marge.
          PROFILES="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          for attempt in 1 2 3 4; do
            echo "::group::Archivage — tentative $attempt sur 4"
            echo "Profils déjà présents : $(ls -1 "$PROFILES" 2>/dev/null | wc -l | tr -d ' ')"

            set +e
            xcodebuild archive \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8" \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER_ID" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              $VERSION_ARGS \
              2>&1 | tee "$RAW" | $FORMATTER
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            [ "$status" -eq 0 ] && break

            # Ne réessayer que pour cette cause précise. Une erreur de
            # compilation ne se répare pas en insistant, et trois tentatives
            # de plus ne feraient que retarder son diagnostic de vingt
            # minutes.
            if ! grep -q "Build input file cannot be found.*mobileprovision" "$RAW"; then
              echo "::error::L'archivage a échoué pour une autre raison qu'un profil manquant."
              exit "$status"
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Quatre tentatives, et il manque toujours un profil."
              echo "Le téléchargement ne converge pas : il faudra poser les profils"
              echo "nous-mêmes par l'API plutôt que de les demander à Xcode."
              exit "$status"
            fi
            echo "::notice::Profil manquant — nouvelle tentative, un profil de plus en main."
          done

      - name: Dire ce que la signature a refusé
        if: failure()
        run: |
          RAW="$GITHUB_WORKSPACE/build/xcodebuild-archive.log"
          [ -f "$RAW" ] || exit 0

          # Ce que xcbeautify n'a pas montré. La signature automatique est la
          # seule partie du build qui dépend d'un état distant — profils et
          # certificats chez Apple — et son diagnostic tient dans ces lignes.
          echo "::group::Signature : lignes utiles du journal brut"
          grep -iE "provisioning|certificat|signing|codesign|entitlement|no account|team|does not (have|match)|failed to|unable to" \
            "$RAW" | sort -u | head -60 || echo "Rien à signaler dans le journal brut."
          echo "::endgroup::"

          echo "::group::Profils réellement présents sur l'exécuteur"
          ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" 2>/dev/null || echo "dossier absent"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null || echo "dossier absent"
          echo "::endgroup::"

          echo "::group::Certificats de signature visibles"
          security find-identity -v -p codesigning || true
          echo "::endgroup::"

      - name: Exporter et envoyer à TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          # `destination: upload` fait l'envoi dans la foulée de l'export,
          # sans passer par altool, que Apple a déprécié.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <!-- Sans cette ligne, l'export retombe en signature manuelle et
                 réclame un profil pour chacune des trois cibles, alors que le
                 projet est en signature automatique et que l'archive vient
                 d'être signée sans encombre. Le message ne parle pas de style
                 de signature : il dit seulement qu'il « faut un profil ». -->
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$EXPORT_DIR" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/xcodebuild-export.log" | $FORMATTER

      - name: Récupérer le journal de distribution
        if: failure()
        run: |
          # Xcode range le détail de l'échec d'envoi dans un dossier temporaire
          # dont il imprime le chemin, puis l'exécuteur est détruit avec. Le
          # journal visible, lui, se réduit à une phrase qui ne nomme rien.
          LOG="$GITHUB_WORKSPACE/build/xcodebuild-export.log"
          [ -f "$LOG" ] || exit 0
          BUNDLE="$(sed -n 's/.*Created bundle at path "\([^"]*\)".*/\1/p' "$LOG" | head -1)"
          [ -n "$BUNDLE" ] && [ -d "$BUNDLE" ] || exit 0
          cp -R "$BUNDLE" "$GITHUB_WORKSPACE/build/distribution-logs" || true
          echo "::group::Détail de l'échec d'envoi"
          find "$GITHUB_WORKSPACE/build/distribution-logs" -type f -name "*.txt" \
            -exec sh -c 'echo "--- $1"; tail -40 "$1"' _ {} \;
          echo "::endgroup::"

      - name: Rendre la place du certificat
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
        run: |
          # Le certificat créé pour cette exécution est révoqué, qu'elle ait
          # réussi ou non. Sa clé privée disparaît avec l'exécuteur : le
          # garder ne servirait à personne, et un compte n'a droit qu'à deux
          # certificats de distribution. Sans ce ménage, deux builds suffisent
          # à saturer le compte — c'est exactement ce qui est arrivé.
          [ -f "$RUNNER_TEMP/certificate-id.txt" ] || exit 0
          export ASC_KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          python3 tools/appstore/distribution_certificate.py \
            --revoke "$(cat "$RUNNER_TEMP/certificate-id.txt")" || \
            echo "::warning::Révocation impossible ; à faire à la main si le compte sature."

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "### TestFlight"
            echo ""
            echo "- Build : \`$BUILD_NUMBER\`"
            echo "- Version : \`${{ inputs.version || 'celle du projet' }}\`"
            echo "- Nouveautés : ${{ inputs.notes }}"
            echo ""
            echo "Le traitement par Apple prend cinq à quinze minutes après l'envoi."
            echo "Le build apparaît ensuite dans App Store Connect → TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Garder les journaux en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-xcodebuild
          path: |
            ${{ github.workspace }}/build/**/*.log
