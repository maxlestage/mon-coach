name: Prêt pour la vente

# Répond à « il manque quoi ? » sans avoir à s'en souvenir.
#
# La liste des choses qui restent à faire avant de vendre vieillit vite : elle
# garde des cases déjà cochées et rate celles qu'Apple vient d'ajouter. Une
# liste fausse coûte plus cher que pas de liste, parce qu'on la croit. Ce
# workflow demande l'état à Apple et le rend en clair.
#
# C'est une lecture. Rien n'est modifié chez Apple.

on:
  workflow_dispatch:

jobs:
  etat:
    name: Ce qui manque avant de vendre
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Interroger App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 || secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          # La clé est écrite hors du dépôt, dans un dossier qui meurt avec la
          # machine. Elle est acceptée en clair comme en base64 : le workflow
          # s'adapte au secret posé plutôt que l'inverse.
          mkdir -p "$RUNNER_TEMP/private_keys"
          export ASC_KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          case "$PRIVATE_KEY" in
            *"BEGIN PRIVATE KEY"*) printf '%s\n' "$PRIVATE_KEY" > "$ASC_KEY_PATH" ;;
            *) printf '%s' "$PRIVATE_KEY" | base64 --decode > "$ASC_KEY_PATH" ;;
          esac
          chmod 600 "$ASC_KEY_PATH"

          python3 tools/appstore/pret_pour_la_vente.py | tee "$RUNNER_TEMP/etat.txt"

      - name: Récapitulatif
        if: always()
        run: |
          {
            echo "## Prêt pour la vente"
            echo
            echo '```'
            cat "$RUNNER_TEMP/etat.txt" 2>/dev/null || echo "Lecture impossible."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
