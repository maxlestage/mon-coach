name: Déploiement

# Le site part en production quand master bouge. Le job s'ignore proprement
# tant que les identifiants Heroku ne sont pas renseignés : tant que le dépôt
# n'est pas configuré, ce workflow ne fait pas échouer master.

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Deux déploiements simultanés se marcheraient dessus : on les met à la queue.
concurrency:
  group: heroku-production
  cancel-in-progress: false

jobs:
  heroku:
    name: Site → Heroku
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      # Le nom de l'application n'est pas un secret : il apparaît dans
      # l'adresse du site. Il est donc écrit ici, avec une variable de dépôt
      # comme échappatoire si l'application est renommée. Une manipulation de
      # moins à faire pour mettre le déploiement en route.
      HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME || 'moncoach' }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le déploiement est configuré
        id: config
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "::notice::Déploiement non configuré : le secret HEROKU_API_KEY manque. Voir docs/DEPLOIEMENT.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Application visée : $HEROKU_APP_NAME"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Passer l'application sur la pile conteneur
        if: steps.config.outputs.ready == 'true'
        run: |
          # Premier appel à l'API : il vaut vérification que la clé est
          # valide et que l'application existe bien sous ce nom.
          if ! curl -sS -o /dev/null -w '%{http_code}' \
              "https://api.heroku.com/apps/$HEROKU_APP_NAME" \
              -H "Accept: application/vnd.heroku+json; version=3" \
              -H "Authorization: Bearer $HEROKU_API_KEY" | grep -q '^200$'; then
            echo "::error::L'application « $HEROKU_APP_NAME » est introuvable, ou la clé d'API est invalide. Corrige la variable de dépôt HEROKU_APP_NAME ou le secret HEROKU_API_KEY."
            exit 1
          fi

          # Idempotent : Heroku n'accepte une image Docker que si la pile de
          # construction de l'application est « container ».
          curl -sS --fail-with-body -X PATCH \
            "https://api.heroku.com/apps/$HEROKU_APP_NAME" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -d '{"build_stack":"container"}' > /dev/null
          echo "Pile de construction : container"

      - name: Connexion au registre Heroku
        if: steps.config.outputs.ready == 'true'
        run: echo "$HEROKU_API_KEY" | docker login registry.heroku.com -u _ --password-stdin

      - name: Construire et pousser l'image
        if: steps.config.outputs.ready == 'true'
        run: |
          IMAGE="registry.heroku.com/$HEROKU_APP_NAME/web"
          docker build -t "$IMAGE" ./web
          docker push "$IMAGE"

      - name: Mettre l'image en production
        if: steps.config.outputs.ready == 'true'
        run: |
          IMAGE="registry.heroku.com/$HEROKU_APP_NAME/web"
          IMAGE_ID=$(docker inspect "$IMAGE" --format '{{.Id}}')
          curl -sS --fail-with-body -X PATCH \
            "https://api.heroku.com/apps/$HEROKU_APP_NAME/formation" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -d "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"$IMAGE_ID\"}]}" > /dev/null
          echo "Image publiée : $IMAGE_ID"

      - name: S'assurer qu'un dyno tourne
        if: steps.config.outputs.ready == 'true'
        run: |
          # Une mise en production sur zéro dyno est un déploiement qui n'a
          # servi à rien : on le rend explicite plutôt que silencieux.
          curl -sS --fail-with-body -X PATCH \
            "https://api.heroku.com/apps/$HEROKU_APP_NAME/formation/web" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -d '{"quantity":1}' > /dev/null

      - name: Vérifier que le site répond
        if: steps.config.outputs.ready == 'true'
        run: |
          URL=$(curl -sS \
            "https://api.heroku.com/apps/$HEROKU_APP_NAME" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            | grep -o '"web_url":"[^"]*"' | cut -d'"' -f4)
          URL="${URL:-https://$HEROKU_APP_NAME.herokuapp.com/}"
          echo "URL : $URL"

          # Un dyno froid met une poignée de secondes à répondre.
          for attempt in $(seq 1 24); do
            code=$(curl -s -o /tmp/page.html -w "%{http_code}" "$URL" || true)
            if [ "$code" = "200" ] && grep -q "Mon Coach" /tmp/page.html; then
              echo "::notice::Le site est en ligne : $URL"
              exit 0
            fi
            echo "Tentative $attempt : code $code"
            sleep 5
          done
          echo "::error::Le site ne répond pas après le déploiement. Regarde les logs du dyno dans le tableau de bord Heroku."
          exit 1
